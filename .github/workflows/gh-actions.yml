name: Build & Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # A pull request from a fork gets no secrets: skip it, its branch is built when pushed to this repository
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    concurrency:
      group: oanda-test-account
      queue: max
    container:
        image: quantconnect/lean:foundation
        options: --cpus 12 --memory 12g
        env:
          QC_OANDA_ENVIRONMENT: ${{ secrets.QC_OANDA_ENVIRONMENT }}
          QC_OANDA_ACCESS_TOKEN: ${{ secrets.QC_OANDA_ACCESS_TOKEN }}
          QC_OANDA_ACCOUNT_ID: ${{ secrets.QC_OANDA_ACCOUNT_ID }}
          QC_JOB_USER_ID: ${{ secrets.JOB_USER_ID }}
          QC_API_ACCESS_TOKEN: ${{ secrets.API_ACCESS_TOKEN }}
          QC_JOB_ORGANIZATION_ID: ${{ secrets.JOB_ORGANIZATION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Checkout Lean Same Branch
        id: lean-same-branch
        uses: actions/checkout@v2
        continue-on-error: true
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          repository: QuantConnect/Lean
          path: Lean

      - name: Checkout Lean Master
        if: steps.lean-same-branch.outcome != 'success'
        uses: actions/checkout@v2
        with:
          repository: QuantConnect/Lean
          path: Lean

      - name: Move Lean
        run: rm -rf ../Lean && mv Lean ../Lean

      - name: Run build and tests
        run: |
          # Build
          dotnet build /p:Configuration=Release /v:quiet /p:WarningLevel=1 QuantConnect.OandaBrokerage.sln && \
          # Run Tests
          dotnet test ./QuantConnect.OandaBrokerage.Tests/bin/Release/QuantConnect.OandaBrokerage.Tests.dll

